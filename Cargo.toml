[package]
name = "learning-lm-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.4.3"
tokenizers = "0.19.1"
rand = "0.8"
rand_distr = "0.4"
num-traits = "0.2"
half = "1.8"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.9"
rayon = "1.6"
criterion = "0.3"
cust = "0.3.2"
once_cell = "1.17"

[features]
gpu = []          # 启用 GPU 后端
mixed_precision = []  # 混合精度计算